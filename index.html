<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <title>Md Mikail Ansari | Creative Technologist – Frontend, Systems &amp; Print Production</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="%SITE_URL%/" data-needs-site-url />

    <!-- Set the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ma-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "light" ? "#faf6ee" : "#07060b");
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Md Mikail Ansari | Creative Technologist" />
    <meta
      property="og:description"
