<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080B12" />
    <title>Page not found | Md Mikail Ansari</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
        background:radial-gradient(60% 50% at 20% 10%,rgba(59,130,246,.16),transparent),#080B12;color:#e6edf7;
        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      p.code{font-family:ui-monospace,Menlo,monospace;color:#22d3ee;font-size:14px;margin:0}
      h1{font-size:clamp(44px,10vw,84px);margin:12px 0 0;letter-spacing:-.03em;line-height:1.05;
        background:linear-gradient(100deg,#67e8f9,#22d3ee 35%,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
      p.msg{color:#93a0b5;max-width:420px;margin:20px auto 0;line-height:1.6}
      a{display:inline-block;margin-top:32px;padding:12px 24px;border-radius:12px;font-weight:600;font-size:14px;
        color:#04141a;text-decoration:none;background:linear-gradient(90deg,#22d3ee,#3b82f6)}
      a:hover{filter:brightness(1.1)} a:focus-visible{outline:2px solid #22d3ee;outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p class="msg">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">&larr; Back to home</a>
    </main>
  </body>
</html>
