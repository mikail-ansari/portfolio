<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07060b" />
    <title>Page not found | Md Mikail Ansari</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:#f4f1fb;
        background:radial-gradient(60% 50% at 15% 10%,rgba(124,58,237,.35),transparent),radial-gradient(40% 40% at 90% 90%,rgba(200,255,62,.12),transparent),#07060b;
        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      p.code{font-family:ui-monospace,Menlo,monospace;color:#c8ff3e;font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin:0}
      h1{font-size:clamp(52px,13vw,150px);margin:18px 0 0;letter-spacing:-.04em;line-height:.9;text-transform:uppercase;font-weight:900}
      h1 span{color:transparent;-webkit-text-stroke:1.5px #b87bff}
      h1 b{background:linear-gradient(95deg,#b87bff,#7c3aed 45%,#c8ff3e);-webkit-background-clip:text;background-clip:text;color:transparent}
      p.msg{color:#a19bb5;max-width:420px;margin:24px auto 0;line-height:1.6}
      a{display:inline-block;margin-top:36px;padding:16px 32px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.04em;
        text-transform:uppercase;color:#0b0b0f;text-decoration:none;background:#c8ff3e}
      a:hover{box-shadow:0 0 40px -6px #c8ff3e} a:focus-visible{outline:2px solid #c8ff3e;outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1><span>Page</span> <b>lost</b></h1>
      <p class="msg">The page you're looking for doesn't exist or has moved. Let's get you back to the good stuff.</p>
      <a href="/">&larr; Back home</a>
    </main>
  </body>
</html>
